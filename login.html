<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#241726">
<title>Sign in — Sweet Munchies Kitchen</title>
<link rel="icon" href="img/icon-180.png">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --pink:#ff2d87; --pink-dark:#d81b6a; --pink-soft:#fff0f6;
    --ink:#241726; --muted:#7b7280; --border:#f6e2ec;
  }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:#f4eef2; min-height:100vh; display:flex; align-items:center;
    justify-content:center; padding:24px; color:var(--ink);
  }
  .card{
    background:#fff; border-radius:18px; box-shadow:0 4px 32px rgba(0,0,0,.08);
    padding:40px 32px; width:100%; max-width:380px;
  }
  .logo{font-size:1.4rem; font-weight:900; text-align:center; margin-bottom:4px}
  .logo span{color:var(--pink)}
  .subtitle{text-align:center; color:var(--muted); font-size:.85rem; margin-bottom:30px}
  .field{margin-bottom:16px}
  .field label{
    display:block; font-size:.7rem; font-weight:700; color:var(--muted);
    text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px;
  }
  .field input{
    width:100%; min-height:44px; padding:11px 14px; border:1.5px solid var(--border);
    border-radius:10px; font-size:16px; color:var(--ink); background:var(--pink-soft);
    outline:none;
  }
  .field input:focus{border-color:var(--pink)}
  .btn{
    width:100%; min-height:46px; padding:12px; background:var(--pink); color:#fff;
    border:none; border-radius:10px; font-size:.95rem; font-weight:800;
    cursor:pointer; margin-top:6px;
  }
  .btn:hover{background:var(--pink-dark)}
  .error{
    background:#fff5f5; border:1.5px solid #fc8181; border-radius:10px;
    padding:10px 14px; font-size:.83rem; color:#c53030; margin-bottom:16px; display:none;
  }
  .demo-note{
    margin-top:22px; padding:12px 14px; background:var(--pink-soft); border-radius:10px;
    font-size:.75rem; color:var(--muted); text-align:center; line-height:1.5;
  }
  .demo-note strong{color:var(--pink-dark)}
  .back-link{
    display:block; text-align:center; margin-top:18px; font-size:.8rem;
    color:var(--muted); text-decoration:none;
  }
  .back-link:hover{color:var(--pink)}
</style>
</head>
<body>

<div class="card">
  <div class="logo">🧇 Sweet <span>Munchies</span></div>
  <div class="subtitle">Kitchen dashboard — staff sign in required</div>

  <div class="error" id="errorMsg">Incorrect email or password. Try again.</div>

  <div class="field">
    <label>Email</label>
    <input type="email" id="email" placeholder="staff@sweetmunchies.co.uk" autocomplete="email">
  </div>
  <div class="field">
    <label>Password</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
  </div>

  <button class="btn" onclick="doLogin()">Sign in →</button>

  <div class="demo-note">
    <strong>Demo credentials</strong><br>
    Email: staff@sweetmunchies.co.uk<br>
    Password: sweetmunchies124
  </div>

  <a href="index.html" class="back-link">← Back to storefront</a>
</div>

<script src="js/data.js"></script>
<script>
  var SM_AUTH_KEY = 'sm_admin_auth';
  var SM_PIN_KEY = 'sm_admin_pin';
  var DEMO_EMAIL = 'staff@sweetmunchies.co.uk';

  // Already signed in? Go straight to the dashboard.
  try {
    if (sessionStorage.getItem(SM_PIN_KEY)) {
      window.location.href = 'admin.html';
    }
  } catch (e) {}

  // The password is checked by the database itself (sm_check_staff_pin),
  // not just compared to a value sitting in this page's own code — so
  // someone can't just read the page source to get past this screen.
  async function doLogin() {
    var email = document.getElementById('email').value.trim().toLowerCase();
    var password = document.getElementById('password').value;
    var err = document.getElementById('errorMsg');
    var btn = document.querySelector('.btn');

    if (email !== DEMO_EMAIL || !password) {
      err.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Checking…';
    try {
      var res = await fetch(SB_URL + '/rest/v1/rpc/sm_check_staff_pin', {
        method: 'POST',
        headers: {
          'apikey': SB_KEY,
          'Authorization': 'Bearer ' + SB_KEY,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ p_pin: password })
      });
      var ok = res.ok && (await res.json()) === true;
      if (ok) {
        try { sessionStorage.setItem(SM_PIN_KEY, password); } catch (e) {}
        window.location.href = 'admin.html';
      } else {
        err.style.display = 'block';
      }
    } catch (e) {
      err.textContent = 'Could not reach the server — check your connection and try again.';
      err.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Sign in →';
    }
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') doLogin();
  });
</script>
</body>
</html>
